<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAR · Streaming Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --c-bg:          transparent;
    --c-panel:       rgba(8, 12, 20, 0.72);
    --c-panel-hover: rgba(8, 12, 20, 0.88);
    --c-border:      rgba(90, 180, 255, 0.18);
    --c-border-hot:  rgba(90, 180, 255, 0.55);
    --c-text:        #d8e8f8;
    --c-muted:       rgba(160, 190, 220, 0.45);
    --c-accent:      #4ab4ff;
    --c-accent2:     #ff6b35;
    --c-danger:      #ff3b5c;
    --c-success:     #30f0a0;
    --c-gold:        #f0c040;
    --font-display:  'Rajdhani', sans-serif;
    --font-mono:     'Share Tech Mono', monospace;
    --radius:        4px;
    --glow:          0 0 18px rgba(74, 180, 255, 0.25);
    --glow-hot:      0 0 28px rgba(74, 180, 255, 0.55);
}

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: var(--font-display);
    color: var(--c-text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════
   STREAMING OVERLAY CANVAS
═══════════════════════════════════════════════════ */
#streaming-canvas {
    position: fixed;
    inset: 0;
    background: transparent;
    /* Subtle scan-line texture for streamer aesthetic */
    background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,20,40,0.03) 2px,
        rgba(0,20,40,0.03) 4px
    );
    pointer-events: none;
    z-index: 0;
}

#widget-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: hidden;
}

/* ═══════════════════════════════════════════════════
   WIDGET BASE
═══════════════════════════════════════════════════ */
.wm-widget {
    position: absolute;
    cursor: grab;
    pointer-events: all;
    transition: opacity 0.25s ease, box-shadow 0.2s ease;
    will-change: transform;
}

.wm-widget:hover     { z-index: 100; }
.wm-widget.wm-dragging { cursor: grabbing; z-index: 200; }

.wm-widget.wm-disabled {
    opacity: 0.25;
    pointer-events: none;
}

/* Hidden disabled widgets are display:none via JS */
.wm-widget.wm-disabled.wm-show-disabled {
    pointer-events: all;
    opacity: 0.18;
    outline: 1px dashed rgba(90,180,255,0.3);
}

/* Scale indicator flash on scroll */
.wm-widget.wm-scaling::after {
    content: attr(data-scale);
    position: absolute;
    top: -1.6em;
    right: 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--c-accent);
    background: var(--c-panel);
    padding: 1px 5px;
    border-radius: var(--radius);
    pointer-events: none;
    animation: fadeScaleHint 1s forwards;
}

@keyframes fadeScaleHint {
    0%   { opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
}

/* ═══════════════════════════════════════════════════
   TRIGGER WIDGET
═══════════════════════════════════════════════════ */
.wm-type-trigger .wm-inner {
    min-width: 14em;
    max-width: 28em;
    pointer-events: none;
}

.wt-stack {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    pointer-events: none;
}

.wt-card {
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.55em 1em 0.55em 0.7em;
    background: rgba(8, 14, 28, 0.82);
    border: 1px solid rgba(74, 180, 255, 0.35);
    border-left: 3px solid var(--c-accent);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    box-shadow: var(--glow), inset 0 1px 0 rgba(255,255,255,0.04);

    /* Entry state */
    opacity: 0;
    transform: translateX(-1.5em) scaleY(0.85);
    transform-origin: left center;
    transition:
        opacity 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.wt-card-visible {
    opacity: 1;
    transform: translateX(0) scaleY(1);
}

.wt-card-exit {
    opacity: 0 !important;
    transform: translateX(2em) scaleY(0.6) !important;
    transition:
        opacity 0.45s ease,
        transform 0.45s ease !important;
}

.wt-icon {
    font-size: 1.1em;
    color: var(--c-accent);
    flex-shrink: 0;
    animation: iconPulse 0.6s ease;
}

@keyframes iconPulse {
    0%   { transform: scale(1.8); opacity: 0.5; }
    60%  { transform: scale(1.0); opacity: 1;   }
    100% { transform: scale(1.0); }
}

.wt-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05em;
    letter-spacing: 0.04em;
    color: var(--c-text);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Hot flash when a new card arrives */
.wt-card-visible:last-child {
    border-left-color: var(--c-accent2);
    animation: hotFlash 0.5s ease forwards;
}

@keyframes hotFlash {
    0%   { box-shadow: 0 0 30px rgba(255, 107, 53, 0.7), var(--glow); }
    100% { box-shadow: var(--glow); }
}

/* ═══════════════════════════════════════════════════
   STAT WIDGETS
═══════════════════════════════════════════════════ */
.wm-type-stat .wm-inner {
    pointer-events: none;
}

.ws-widget {
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.5em 0.9em 0.5em 0.6em;
    background: rgba(8, 14, 28, 0.78);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    backdrop-filter: blur(8px);
    box-shadow: var(--glow), inset 0 1px 0 rgba(255,255,255,0.03);
    transition: border-color 0.2s, box-shadow 0.2s;
    white-space: nowrap;
    min-width: 9em;
}

.wm-widget:hover .ws-widget {
    border-color: var(--c-border-hot);
    box-shadow: var(--glow-hot), inset 0 1px 0 rgba(255,255,255,0.05);
}

.ws-icon {
    font-size: 1.1em;
    color: var(--c-accent);
    width: 1.2em;
    text-align: center;
    flex-shrink: 0;
}

.ws-body {
    display: flex;
    flex-direction: column;
    gap: 0;
}

.ws-value {
    font-family: var(--font-mono);
    font-size: 1.35em;
    line-height: 1.1;
    color: var(--c-accent);
    letter-spacing: -0.01em;
    transition: color 0.4s ease;
}

.ws-value.ws-flash {
    color: var(--c-gold);
    text-shadow: 0 0 12px rgba(240, 192, 64, 0.6);
}

.ws-label {
    font-size: 0.62em;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--c-muted);
    font-weight: 600;
    line-height: 1.2;
}

/* Per-stat accent colours */
#stat-kills     .ws-icon, #stat-kills     .ws-value { color: var(--c-success); }
#stat-losses    .ws-icon, #stat-losses    .ws-value { color: var(--c-danger);  }
#stat-metal-lost .ws-icon, #stat-metal-lost .ws-value { color: var(--c-gold);  }
#stat-dmg-dealt .ws-value { color: #7fffd4; }
#stat-dmg-taken .ws-value { color: #ff9060; }

/* ═══════════════════════════════════════════════════
   HUD BAR (top strip)
═══════════════════════════════════════════════════ */
#hud-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2.2rem;
    display: flex;
    align-items: center;
    padding: 0 1rem;
    background: rgba(5, 8, 18, 0.7);
    border-bottom: 1px solid var(--c-border);
    backdrop-filter: blur(8px);
    z-index: 50;
    gap: 1rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--c-muted);
    pointer-events: all;
}

#hud-bar .hud-brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: var(--c-accent);
    text-transform: uppercase;
}

#hud-bar .hud-sep { flex: 1; }

#hud-bar .hud-hint {
    opacity: 0.5;
    font-size: 0.68rem;
}

#hud-back-btn {
    background: none;
    border: 1px solid var(--c-border);
    color: var(--c-muted);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    padding: 0.15rem 0.6rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
}
#hud-back-btn:hover {
    color: var(--c-text);
    border-color: var(--c-accent);
}

/* ═══════════════════════════════════════════════════
   DISABLED BANNER (space bar hint)
═══════════════════════════════════════════════════ */
#disabled-hint {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--c-muted);
    letter-spacing: 0.1em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 200;
}
#disabled-hint.visible { opacity: 1; }

/* ═══════════════════════════════════════════════════
   VALUE CHANGE ANIMATION
═══════════════════════════════════════════════════ */
@keyframes valueChange {
    0%   { transform: translateY(-0.3em); opacity: 0; }
    60%  { transform: translateY(0.05em); opacity: 1; }
    100% { transform: translateY(0);      opacity: 1; }
}

.ws-value.ws-animate {
    animation: valueChange 0.25s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
}

/* ═══════════════════════════════════════════════════
   SCROLLBAR (hidden globally for overlay feel)
═══════════════════════════════════════════════════ */
::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- Scanline overlay -->
<div id="streaming-canvas" aria-hidden="true"></div>

<!-- HUD bar -->
<div id="hud-bar">
    <span class="hud-brand">BAR · STREAM</span>
    <span class="hud-sep"></span>
    <span class="hud-hint">scroll = scale &nbsp;·&nbsp; dblclick = toggle &nbsp;·&nbsp; space = show hidden &nbsp;·&nbsp; esc = back</span>
    <button id="hud-back-btn">← BACK</button>
</div>

<!-- Widget layer -->
<div id="widget-layer"></div>

<!-- Disabled hint -->
<div id="disabled-hint">SHOWING DISABLED WIDGETS</div>

<!--
    In production, these are loaded by PHP/CMS in order:
    1. gameStateStore.js
    2. widgetManager.js
    3. barWidgets.js
    (eventHandler.js already triggers statWidgets.tick() and widgetManager.emitTrigger())
-->

<script>
/* ═══════════════════════════════════════════════════════════════════════
   WIDGET MANAGER
   (In production: external file. Inlined here for standalone delivery.)
═══════════════════════════════════════════════════════════════════════ */
class WidgetManager {
    constructor() {
        this.widgets     = new Map();
        this.instances   = new Map();
        this.layout      = {};
        this.showDisabled = false;
        this.STORAGE_KEY  = 'bar-widget-layout-v1';
        this.MIN_SCALE    = 0.5;
        this.MAX_SCALE    = 2.0;
        this.SCALE_STEP   = 0.1;
        this._loadLayout();
        this._bindGlobalKeys();
    }

    register(def) {
        if (!this.widgets.has(def.id)) this.widgets.set(def.id, def);
        return this;
    }

    mountAll(containerEl) {
        this.container = containerEl;
        for (const [id, def] of this.widgets) this._mountWidget(id, def);
    }

    update(id, data) {
        const inst = this.instances.get(id);
        const def  = this.widgets.get(id);
        if (!inst || !def || !def.update) return;
        def.update(def, inst.inner, data);
    }

    emitTrigger(triggerData) {
        for (const [id, def] of this.widgets) {
            if (def.type === 'trigger' && def.onTrigger) {
                const inst = this.instances.get(id);
                if (inst && inst.state.enabled) def.onTrigger(def, inst.inner, triggerData);
            }
        }
    }

    _mountWidget(id, def) {
        const saved = this.layout[id] || {};
        const state = {
            x:       saved.x       ?? def.defaultX       ?? 20,
            y:       saved.y       ?? def.defaultY       ?? 20,
            scale:   saved.scale   ?? def.defaultScale   ?? 1.0,
            enabled: saved.enabled ?? def.defaultEnabled ?? true,
        };

        const el = document.createElement('div');
        el.className = `wm-widget wm-type-${def.type}`;
        el.dataset.id = id;
        el.id = id;
        el.style.fontSize = `${state.scale}rem`;
        this._applyPosition(el, state);
        this._applyEnabled(el, state);

        const inner = document.createElement('div');
        inner.className = 'wm-inner';
        el.appendChild(inner);

        if (def.render) def.render(def, inner);

        this.container.appendChild(el);
        this.instances.set(id, { el, inner, state });
        this._bindWidgetEvents(id, el, state);
    }

    _applyPosition(el, state) {
        el.style.left = `${state.x}px`;
        el.style.top  = `${state.y}px`;
    }

    _applyEnabled(el, state) {
        if (state.enabled) {
            el.classList.remove('wm-disabled');
            el.style.display = '';
        } else {
            el.classList.add('wm-disabled');
            el.style.display = this.showDisabled ? '' : 'none';
        }
    }

    _bindWidgetEvents(id, el, state) {
        let dragging = false, startX, startY, startLeft, startTop;
        let scaleHintTimer = null;

        el.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            dragging = true;
            startX = e.clientX; startY = e.clientY;
            startLeft = state.x; startTop = state.y;
            el.classList.add('wm-dragging');
            e.preventDefault();
        });

        const onMove = (e) => {
            if (!dragging) return;
            state.x = startLeft + (e.clientX - startX);
            state.y = startTop  + (e.clientY - startY);
            this._applyPosition(el, state);
        };

        const onUp = () => {
            if (!dragging) return;
            dragging = false;
            el.classList.remove('wm-dragging');
            this._saveLayout();
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);

        el.addEventListener('dblclick', (e) => {
            e.preventDefault();
            state.enabled = !state.enabled;
            this._applyEnabled(el, state);
            this._saveLayout();
        });

        el.addEventListener('wheel', (e) => {
            e.preventDefault();
            const dir = e.deltaY < 0 ? 1 : -1;
            state.scale = Math.min(this.MAX_SCALE, Math.max(this.MIN_SCALE,
                Math.round((state.scale + dir * this.SCALE_STEP) * 100) / 100
            ));
            el.style.fontSize = `${state.scale}rem`;

            // Show scale hint
            el.dataset.scale = `×${state.scale.toFixed(1)}`;
            el.classList.remove('wm-scaling');
            void el.offsetWidth;
            el.classList.add('wm-scaling');
            clearTimeout(scaleHintTimer);
            scaleHintTimer = setTimeout(() => el.classList.remove('wm-scaling'), 1100);

            this._saveLayout();
        }, { passive: false });
    }

    _bindGlobalKeys() {
        const hint = document.getElementById('disabled-hint');

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.matches('input,textarea')) {
                e.preventDefault();
                this.showDisabled = !this.showDisabled;
                for (const [, inst] of this.instances) {
                    if (!inst.state.enabled) {
                        inst.el.style.display = this.showDisabled ? '' : 'none';
                        if (this.showDisabled) inst.el.classList.add('wm-show-disabled');
                        else inst.el.classList.remove('wm-show-disabled');
                    }
                }
                if (hint) {
                    hint.classList.toggle('visible', this.showDisabled);
                }
            }
            if (e.code === 'Escape') {
                document.dispatchEvent(new CustomEvent('wm:escape'));
            }
        });
    }

    _saveLayout() {
        const out = {};
        for (const [id, inst] of this.instances) out[id] = { ...inst.state };
        try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(out)); } catch(e) {}
    }

    _loadLayout() {
        try {
            const raw = localStorage.getItem(this.STORAGE_KEY);
            this.layout = raw ? JSON.parse(raw) : {};
        } catch(e) { this.layout = {}; }
    }

    resetLayout() {
        localStorage.removeItem(this.STORAGE_KEY);
        this.layout = {};
        for (const [, inst] of this.instances) inst.el.remove();
        this.instances.clear();
        this.mountAll(this.container);
    }
}

const widgetManager = new WidgetManager();


/* ═══════════════════════════════════════════════════════════════════════
   MOCK GAMESTATE (replace with real gameState in production)
═══════════════════════════════════════════════════════════════════════ */
const _mockTeam = {
    unitCount: 0, totalMetalCost: 0, totalDamageDealt: 0,
    totalDamageTaken: 0, killedCount: 0, lostCount: 0, metalLost: 0
};
const gameState = {
    getMyTeam: () => _mockTeam
};

// Simulate data changing for demo
setInterval(() => {
    _mockTeam.unitCount       = Math.floor(Math.random() * 80 + 20);
    _mockTeam.totalMetalCost  = Math.floor(Math.random() * 8000 + 1000);
    _mockTeam.killedCount     = Math.floor(Math.random() * 120);
    _mockTeam.lostCount       = Math.floor(Math.random() * 60);
    _mockTeam.totalDamageDealt = Math.floor(Math.random() * 500000);
    _mockTeam.totalDamageTaken = Math.floor(Math.random() * 300000);
    _mockTeam.metalLost        = Math.floor(Math.random() * 4000);
    statWidgets.tick();
}, 2500);


/* ═══════════════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════════════════ */
function _escHtml(str) {
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _fmtNum(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'K';
    return String(Math.round(n));
}


/* ═══════════════════════════════════════════════════════════════════════
   TRIGGER WIDGET
═══════════════════════════════════════════════════════════════════════ */
const TRIGGER_DISPLAY_MS = 4500;
const TRIGGER_MAX_STACK  = 8;

widgetManager.register({
    id: 'trigger-feed',
    type: 'trigger',
    label: 'Trigger Feed',
    defaultX: 30,
    defaultY: 40,
    defaultScale: 1.0,
    defaultEnabled: true,

    render(def, inner) {
        inner.innerHTML = `<div class="wt-stack"></div>`;
    },

    onTrigger(def, inner, triggerData) {
        const stack = inner.querySelector('.wt-stack');
        if (!stack) return;

        while (stack.children.length >= TRIGGER_MAX_STACK) stack.removeChild(stack.firstChild);

        const card = document.createElement('div');
        card.className = 'wt-card';
        card.innerHTML = `
            <span class="wt-icon">⚡</span>
            <span class="wt-title">${_escHtml(triggerData.name || 'Trigger Fired')}</span>
        `;
        stack.appendChild(card);

        requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('wt-card-visible')));

        setTimeout(() => {
            card.classList.remove('wt-card-visible');
            card.classList.add('wt-card-exit');
            card.addEventListener('transitionend', () => card.remove(), { once: true });
        }, TRIGGER_DISPLAY_MS);
    }
});


/* ═══════════════════════════════════════════════════════════════════════
   STAT WIDGETS
═══════════════════════════════════════════════════════════════════════ */
const STAT_DEFS = [
    { id: 'stat-army-value',  label: 'ARMY VALUE',  icon: '⚙', color: 'accent',
      getValue: () => { const t = gameState.getMyTeam(); return t ? Math.round(t.totalMetalCost) : 0; } },
    { id: 'stat-unit-count',  label: 'UNITS',       icon: '▣', color: 'accent',
      getValue: () => { const t = gameState.getMyTeam(); return t ? t.unitCount : 0; } },
    { id: 'stat-kills',       label: 'KILLS',       icon: '✕', color: 'success',
      getValue: () => { const t = gameState.getMyTeam(); return t ? t.killedCount : 0; } },
    { id: 'stat-losses',      label: 'LOSSES',      icon: '↓', color: 'danger',
      getValue: () => { const t = gameState.getMyTeam(); return t ? t.lostCount : 0; } },
    { id: 'stat-dmg-dealt',   label: 'DMG DEALT',   icon: '▲', color: 'teal',
      getValue: () => { const t = gameState.getMyTeam(); return t ? Math.round(t.totalDamageDealt) : 0; } },
    { id: 'stat-dmg-taken',   label: 'DMG TAKEN',   icon: '▼', color: 'orange',
      getValue: () => { const t = gameState.getMyTeam(); return t ? Math.round(t.totalDamageTaken) : 0; } },
    { id: 'stat-metal-lost',  label: 'METAL LOST',  icon: '◆', color: 'gold',
      getValue: () => { const t = gameState.getMyTeam(); return t ? Math.round(t.metalLost || 0) : 0; } },
];

// Arrange in two columns by default
const COL_X = [30, 185];
const ROW_START_Y = 40;
const ROW_GAP = 78;

STAT_DEFS.forEach((s, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    widgetManager.register({
        id: s.id,
        type: 'stat',
        label: s.label,
        defaultX: COL_X[col],
        defaultY: ROW_START_Y + row * ROW_GAP,
        defaultScale: 1.0,
        defaultEnabled: true,
        _getValue: s.getValue,
        _prevValue: null,

        render(def, inner) {
            inner.innerHTML = `
                <div class="ws-widget">
                    <span class="ws-icon">${s.icon}</span>
                    <div class="ws-body">
                        <div class="ws-value" id="${s.id}-val">—</div>
                        <div class="ws-label">${s.label}</div>
                    </div>
                </div>`;
        },

        update(def, inner, data) {
            const valEl = inner.querySelector(`#${s.id}-val`);
            if (!valEl) return;
            const raw = def._getValue();
            const formatted = _fmtNum(raw);
            if (formatted === valEl.textContent) return;

            valEl.textContent = formatted;

            // Flash animation on change
            valEl.classList.remove('ws-animate', 'ws-flash');
            void valEl.offsetWidth; // reflow
            valEl.classList.add('ws-animate');
            if (def._prevValue !== null && raw > def._prevValue) valEl.classList.add('ws-flash');
            def._prevValue = raw;

            setTimeout(() => valEl.classList.remove('ws-animate', 'ws-flash'), 600);
        }
    });
});

const statWidgets = {
    tick() {
        for (const s of STAT_DEFS) widgetManager.update(s.id, null);
    }
};


/* ═══════════════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
    const layer = document.getElementById('widget-layer');
    widgetManager.mountAll(layer);

    // Initial stat render
    statWidgets.tick();

    // Back button / ESC -> navigate to main view
    document.getElementById('hud-back-btn').addEventListener('click', () => {
        document.dispatchEvent(new CustomEvent('wm:escape'));
    });

    document.addEventListener('wm:escape', () => {
        // In production: window.location.href = '/main-view';
        console.log('ESC / BACK pressed — navigate to standard view');
        if (window._barMainPanel) window._barMainPanel.show();
    });

    // Simulate trigger fires every few seconds for demo
    const SAMPLE_TRIGGERS = [
        'Impaler killed 5 units',
        'Metal overflow — build more!',
        'Enemy commander spotted',
        'Unit lost: Juggernaut',
        'Nuke launched!',
        '10 kills: Stinger battery',
    ];
    let tIdx = 0;
    setInterval(() => {
        widgetManager.emitTrigger({ name: SAMPLE_TRIGGERS[tIdx % SAMPLE_TRIGGERS.length] });
        tIdx++;
    }, 3200);
});
</script>
